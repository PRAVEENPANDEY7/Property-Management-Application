server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:propertymanagement}?sslmode=require}}}
    username: ${DB_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: havenestate-production-api
  storage:
    location: ${STORAGE_LOCATION:/var/data/havenestate/uploads}
    max-file-size: 5242880
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  admin:
    initial-email: ${INITIAL_ADMIN_EMAIL:admin@havenestate.com}
    initial-password: ${INITIAL_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.property.management: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
