server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: property-management-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/propertymanagement}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: property-management-api
  storage:
    location: ${STORAGE_LOCATION:uploads/properties}
    max-file-size: 5242880
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    initial-email: ${INITIAL_ADMIN_EMAIL:praveen@admin.com}
    initial-password: ${INITIAL_ADMIN_PASSWORD:praveen@1234}
    force-sync-credentials: ${FORCE_ADMIN_PASSWORD_RESET:true}
