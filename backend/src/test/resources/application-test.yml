spring:
  datasource:
    url: jdbc:h2:mem:propertymanagement_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: aTestSecretKeyWithAtLeast256BitsOfLengthForHmacSha256AlgorithmTesting!
    expiration-ms: 3600000
    issuer: test-issuer
  storage:
    location: target/test-uploads
    max-file-size: 5242880
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
  cors:
    allowed-origins: http://localhost:5173
  admin:
    initial-email: testadmin@example.com
    initial-password: AdminTestPassword123!
